baseURL = "https://maxinthecloud.com/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 1
    title = "Senior DevOps / DevSecOps & Cloud Platform Engineer | AI-driven Automation | MaxInTheCloud.com"
    [languages.en.params]
      description = "Senior DevOps / DevSecOps & Cloud Platform Engineer with 20 years of experience. AI agents for DevOps, AI red teaming, Microsoft Foundry, Kubernetes, Terraform and CI/CD across Azure, AWS and GCP."

  [languages.cs]
    languageCode = "cs"
    languageName = "Čeština"
    weight = 2
    title = "Senior DevOps / DevSecOps & Cloud Platform Engineer | AI automatizace | MaxInTheCloud.com"
    [languages.cs.params]
      description = "Senior DevOps / DevSecOps & Cloud Platform Engineer s 20 lety praxe. AI agenti pro DevOps, AI red teaming, Microsoft Foundry, Kubernetes, Terraform a CI/CD napříč Azure, AWS a GCP."

[permalinks]
  "case-study" = "/case-study/:slug/"

[params]
  description = "Senior DevOps / DevSecOps & Cloud Platform Engineer with 20 years of experience. AI agents for DevOps, AI red teaming, Microsoft Foundry, Kubernetes, Terraform and CI/CD across Azure, AWS and GCP."

  # MailerLite embedded form used for the optional sign-up shown before the CV download
  [params.mailerlite]
    accountId = ""
    formId = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^CI$", "COMMIT_SHA", "BUILD_DURATION"]