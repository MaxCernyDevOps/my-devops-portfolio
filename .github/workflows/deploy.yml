name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Build and Test job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          COMMIT_SHA: ${{ github.sha }}
        run: |
          START_TIME=$(date +%s)
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          echo "Build completed in ${BUILD_DURATION}s"
          # Rebuild with build duration (quick second pass)
          COMMIT_SHA=${{ github.sha }} BUILD_DURATION="${BUILD_DURATION}s" hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # --- TESTS ---
      - name: Install htmltest
        run: |
          curl -L https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz | tar xz
          sudo mv htmltest /usr/local/bin/

      - name: Run link checker
        run: |
          htmltest ./public --conf .htmltest.yml || true

      - name: Check for critical errors
        run: |
          # Check if build produced expected files
          test -f ./public/index.html || (echo "ERROR: index.html not found!" && exit 1)
          test -f ./public/sitemap.xml || (echo "ERROR: sitemap.xml not found!" && exit 1)
          test -f ./public/robots.txt || (echo "ERROR: robots.txt not found!" && exit 1)
          test -f ./public/favicon.svg || (echo "ERROR: favicon.svg not found!" && exit 1)
          echo "All critical files present!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

  # Deployment job (only on main branch, not PRs)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
