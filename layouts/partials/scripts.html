            icon: "fa-solid fa-cog",

            icon: "fa-solid fa-rocket",
            content: `<h3 class="text-white text-xl font-bold mb-4">The Challenge</h3><p class="text-gray-300 mb-6">Developers spent hours writing repetitive CI/CD pipelines and waiting for DevOps support. Each team reinvented the wheel, leading to inconsistent patterns, security gaps, and knowledge silos. The DevOps team became a bottleneck for simple pipeline changes.</p><h3 class="text-white text-xl font-bold mb-4">My Solution</h3><p class="text-gray-300 mb-6">Created a comprehensive library of <strong>modular, reusable GitHub Actions</strong> covering build, test, deploy, security scanning, and notification workflows. Each action is versioned, fully documented with examples, and designed for self-service configuration. Developers now compose complete CI/CD pipelines like LEGO blocks—no DevOps intervention required.</p><h3 class="text-white text-xl font-bold mb-4">The Impact</h3><div class="grid grid-cols-3 gap-4 mb-8 text-center"><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-green-400">80%</div><div class="text-[10px] text-gray-500 uppercase">Faster Pipeline Setup</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-blue-400">95%</div><div class="text-[10px] text-gray-500 uppercase">DevOps Ticket Reduction</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-purple-400">40+</div><div class="text-[10px] text-gray-500 uppercase">Teams Self-Serving</div></div></div>`
        },
        "fastrfc": {
            title: "Automated ServiceNow Change Management",
            tags: ["ServiceNow API", "GitHub Actions", "ITSM Integration"],
            colorClass: "text-cyan-500",
            bgClass: "bg-cyan-500",
            icon: "fa-solid fa-ticket",
            content: `<h3 class="text-white text-xl font-bold mb-4">The Challenge</h3><p class="text-gray-300 mb-6">Enterprise ITSM policies required formal Change Requests (RFCs) for every production deployment, but manual creation caused deployment delays and bottlenecks. Teams needed a way to maintain compliance while enabling rapid, automated deployments without human intervention.</p><h3 class="text-white text-xl font-bold mb-4">My Solution</h3><p class="text-gray-300 mb-6">Built a <strong>reusable GitHub Actions workflow</strong> that automatically creates FastRFC tickets in ServiceNow via API during deployment. The workflow captures deployment metadata (version, environment, approver), submits the RFC, waits for approval, and proceeds with deployment—all without manual steps. Full audit trail maintained in ServiceNow for compliance.</p><h3 class="text-white text-xl font-bold mb-4">The Impact</h3><div class="grid grid-cols-3 gap-4 mb-8 text-center"><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-green-400">100%</div><div class="text-[10px] text-gray-500 uppercase">RFC Compliance</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-blue-400">85%</div><div class="text-[10px] text-gray-500 uppercase">Faster Deployments</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-purple-400">Zero</div><div class="text-[10px] text-gray-500 uppercase">Manual RFC Creation</div></div></div>`

        },

            content: `<h3 class="text-white text-xl font-bold mb-4">The Challenge</h3><p class="text-gray-300 mb-6">Client needed to integrate their proprietary software with another proprietary system, exchanging data through Azure Service Bus while maintaining full auditability and compliance. SharePoint integration was required for document management, and everything needed to be fully automated and version-controlled.</p><h3 class="text-white text-xl font-bold mb-4">My Solution</h3><p class="text-gray-300 mb-6">Architected a complete <strong>IaC-based integration platform</strong> using Azure Service Bus for messaging, Logic Apps for orchestration workflows, API Management for secure API exposure, and SharePoint integration for document handling. All components—including Logic Apps workflows—were defined as code using a hybrid <strong>Terraform + Bicep</strong> deployment strategy. Full GitOps workflow with automated testing and deployment pipelines.</p><h3 class="text-white text-xl font-bold mb-4">The Impact</h3><div class="grid grid-cols-3 gap-4 mb-8 text-center"><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-green-400">100%</div><div class="text-[10px] text-gray-500 uppercase">Infrastructure as Code</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-blue-400">Zero</div><div class="text-[10px] text-gray-500 uppercase">Manual Configuration</div></div><div class="p-4 bg-gray-800 rounded"><div class="text-2xl font-bold text-purple-400">Full</div><div class="text-[10px] text-gray-500 uppercase">Audit Trail</div></div></div>`

    // --- 2. MODAL LOGIC ---
    function openModal(modalId) {

        if (modal) {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Zabrání scrollování pozadí
        }
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.classList.add('hidden');
            document.body.style.overflow = ''; // Povolí scrollování pozadí
        }
    }

    function openCaseStudy(id) {

                </div>

                    ${data.tags.map(tag => `<span class="bg-gray-800 border border-gray-700 px-3 py-1 rounded">${tag}</span>`).join('')}
                </div>
            </div>

            <div class="prose prose-invert prose-lg max-w-none border-t border-gray-800 pt-8">
                ${data.content}

                <h3 class="text-2xl font-bold text-white mb-4">Need similar results?</h3>
                <a href="mailto:info@maxinthecloud.com" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded inline-block">Book an Audit</a>

    document.addEventListener('DOMContentLoaded', () => {

        document.getElementById('hero-cta-placeholder').innerHTML = status.cta_hero_html;

        document.getElementById('nav-cta-placeholder').innerHTML = status.cta_nav_html;

        // 4. Pokud je 'busy', přidáme Notify Modal
        if (availabilityStatus === 'busy') {
            const notifyModalHtml = `
                <div id="notify-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-gray-700 rounded-2xl max-w-xl w-full p-8 relative shadow-2xl">

                        <h2 class="text-2xl font-bold text-white mb-2">Notify Me When Available</h2>

                            Leave your email below and I will contact you immediately when a slot opens up.
                        </p>
                        <form action="YOUR_FORM_BACKEND_ENDPOINT" method="POST" class="space-y-4">
                            <input type="hidden" name="_subject" value="Availability Request - DevOps Architect">
                            <input
                                type="email"
                                name="email"
                                placeholder="Your Professional Email"
                                required
                                class="w-full p-3 bg-gray-800 border border-gray-700 rounded text-white placeholder-gray-500 focus:ring-blue-500 focus:border-blue-500"
                            >
                            <textarea
                                name="project_scope"
                                placeholder="Brief Project Scope (Optional)"
                                rows="3"
                                class="w-full p-3 bg-gray-800 border border-gray-700 rounded text-white placeholder-gray-500 focus:ring-blue-500 focus:border-blue-500"
                            ></textarea>
                            <button type="submit" class="w-full px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded transition">
                                Sign Up for Notification
                            </button>
                        </form>
                        <p class="text-xs text-gray-500 mt-4 text-center">Your data will be used solely for this notification purpose.</p>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', notifyModalHtml);
        }

        // Zavření modalu klávesou ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal('case-study-modal');
                closeModal('protocol-modal');
                const notifyModal = document.getElementById('notify-modal');
                if (notifyModal) closeModal('notify-modal');
            }
        });
    });

    // Zavření mobile menu při kliknutí mimo
    document.addEventListener('click', function(e) {
        const menu = document.getElementById('mobile-menu');
        const menuButton = e.target.closest('button[onclick*="toggleMobileMenu"]');

        if (!menuButton && !menu.contains(e.target) && !menu.classList.contains('hidden')) {
            menu.classList.add('hidden');
        }
    });

    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function(e) {
            const href = this.getAttribute('href');
            if (href !== '#' && href.length > 1) {
                e.preventDefault();
                const target = document.querySelector(href);
                if (target) {
                    const offsetTop = target.offsetTop - 80; // Account for fixed nav
                    window.scrollTo({
                        top: offsetTop,
                        behavior: 'smooth'
                    });
                }
            }
        });
    });
</script>
